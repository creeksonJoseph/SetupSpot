name: Cleanup Orphaned Temp Images

on:
  schedule:
    # Run weekly every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudinary sqlalchemy psycopg2-binary pydantic pydantic-settings python-dotenv

      - name: Run Cleanup Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'github_actions_dummy_secret' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'github_actions_dummy_resend' }}
        run: |
          python backend/scripts/cleanup_orphaned_images.py
